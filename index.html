<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIMA-LAB - Realtime Community</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0d14;
      --panel-bg: rgba(18, 24, 38, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --online-indicator: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; }
    body { background-color: var(--bg-base); color: var(--text-primary); height: 100vh; overflow: hidden; position: relative; }

    /* 背景粒子キャンバス */
    #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .app-container { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; backdrop-filter: blur(12px); }

    /* ヘッダー */
    header { height: 64px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--panel-border); background: rgba(10, 13, 20, 0.6); }
    .brand-title { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; color: #ffffff; }
    .brand-sub { font-size: 11px; color: var(--text-muted); }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .online-counter { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border); padding: 6px 14px; border-radius: 20px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--online-indicator); box-shadow: 0 0 8px var(--online-indicator); }
    
    .btn-auth { background: transparent; border: 1px solid var(--panel-border); color: var(--text-primary); padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-auth:hover { background: rgba(255, 255, 255, 0.05); }
    .btn-auth.primary { background: var(--text-primary); color: var(--bg-base); border: none; font-weight: 600; }
    .btn-auth.primary:hover { background: #e2e8f0; }

    /* ビュー切替制御 */
    .view-section { display: none; width: 100%; height: calc(100vh - 64px); }
    .view-section.active { display: flex; }

    /* 1. ダッシュボード */
    #view-dashboard { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 220px; gap: 20px; padding: 20px 28px; }
    .viewport-panel { grid-column: 1 / 2; grid-row: 1 / 2; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .sidebar-panel { grid-column: 2 / 3; grid-row: 1 / 3; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--panel-border); font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .sidebar-content { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .threads-panel { grid-column: 1 / 2; grid-row: 2 / 3; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px 20px; }

    /* サイドバーの性別グループ */
    .gender-group { display: flex; flex-direction: column; gap: 8px; }
    .group-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 4px; border-bottom: 1px solid var(--panel-border); }

    /* 2. マッチング中 */
    #view-matching { flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
    .progress-circle { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--panel-border); border-top-color: var(--accent-color); animation: spin 1.2s linear infinite; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 3. マッチ成立 */
    #view-matched { flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
    .match-cards { display: flex; gap: 32px; align-items: center; }
    .user-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 220px; }
    .avatar-placeholder { width: 80px; height: 80px; border-radius: 50%; background: var(--panel-border); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }

    /* 4. チャット画面 */
    #view-chat { display: grid; grid-template-columns: 1fr 280px; width: 100%; height: calc(100vh - 64px); }
    .chat-main { display: flex; flex-direction: column; border-right: 1px solid var(--panel-border); }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--panel-border); font-weight: 700; }
    .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message-item { display: flex; gap: 12px; max-width: 70%; }
    .message-bubble { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 12px 16px; border-radius: 12px; font-size: 14px; }
    .chat-input-area { padding: 16px 24px; border-top: 1px solid var(--panel-border); display: flex; gap: 12px; }
    .chat-input { flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; color: var(--text-primary); outline: none; }

    /* 共通ボタン */
    .btn-action-primary { background: var(--accent-color); color: #ffffff; border: none; padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 20px var(--accent-glow); transition: all 0.2s; }
    .btn-action-primary:hover { background: var(--accent-hover); }
    .btn-action-secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text-primary); padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-action-secondary:hover { background: rgba(255, 255, 255, 0.05); }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="app-container">
    <header>
      <div class="brand">
        <span class="brand-title">HIMA-LAB</span>
        <span class="brand-sub">Realtime Community Platform</span>
      </div>
      <div class="header-actions">
        <div class="online-counter">
          <div class="status-dot"></div>
          <span id="online-count">0 online</span>
        </div>
        <button class="btn-auth">ログイン</button>
        <button class="btn-auth primary">新規登録</button>
      </div>
    </header>

    <!-- 1. ダッシュボード画面 -->
    <div id="view-dashboard" class="view-section active">
      <section class="viewport-panel">
        <h2 style="font-size:20px; font-weight:600;">1対1のセッションを開始</h2>
        <button class="btn-action-primary" onclick="switchView('view-matching')">待機キューに入る</button>
      </section>

      <aside class="sidebar-panel">
        <div class="sidebar-header">マッチング待機中</div>
        <div class="sidebar-content" id="sidebar-users">
          <div style="font-size:12px; color:var(--text-muted); text-align:center; padding-top:20px;">現在待機中のユーザーはいません</div>
        </div>
      </aside>

      <section class="threads-panel">
        <div style="font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:12px;">アクティブスレッド</div>
        <div style="display:flex; gap:12px;">
          <button class="btn-action-secondary" style="padding:10px 20px; font-size:13px;" onclick="openGroupChat('#映画ファン (120名)')">#映画ファン スレッドに参加</button>
        </div>
      </section>
    </div>

    <!-- 2. マッチング中画面 -->
    <div id="view-matching" class="view-section">
      <h2 style="font-size:24px; font-weight:600;">マッチング中...</h2>
      <p style="color:var(--text-secondary); font-size:14px;">希望条件と相性の良い人を検索しています。</p>
      <div class="progress-circle">75%</div>
      <button class="btn-action-secondary" onclick="switchView('view-matched')" style="margin-top:20px;">（UI確認用：マッチ成功させる）</button>
    </div>

    <!-- 3. マッチ成立画面 -->
    <div id="view-matched" class="view-section">
      <h2 style="font-size:28px; font-weight:700;">マッチしました！</h2>
      <div class="match-cards">
        <div class="user-card">
          <div class="avatar-placeholder">YOU</div>
          <div style="font-weight:700;">あなた</div>
        </div>
        <div style="font-size:20px; font-weight:700; color:var(--accent-color);">VS</div>
        <div class="user-card">
          <div class="avatar-placeholder">USER</div>
          <div style="font-weight:700;" id="matched-user-name">Kenji S.</div>
        </div>
      </div>
      <button class="btn-action-primary" onclick="openDirectChat()">1対1チャットを始める</button>
    </div>

    <!-- 4. チャット画面 -->
    <div id="view-chat" class="view-section">
      <div class="chat-main">
        <div class="chat-header" id="chat-title">チャットルーム</div>
        <div class="chat-messages" id="chat-messages">
          <div class="message-item">
            <div class="message-bubble">セッションが開始されました。</div>
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" class="chat-input" placeholder="メッセージを入力...">
          <button class="btn-action-primary" style="padding:0 24px;">送信</button>
          <button class="btn-action-secondary" onclick="switchView('view-dashboard')" style="padding:0 16px;">退室</button>
        </div>
      </div>
      <aside class="sidebar-panel" style="border-radius:0; border-top:none; border-bottom:none; border-right:none;">
        <div class="sidebar-header">参加メンバー</div>
        <div class="sidebar-content">
          <div style="font-size:13px; font-weight:600; color:var(--text-secondary);">オンライン: 2名</div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    /* 画面切り替え制御 */
    function switchView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function openDirectChat() {
      const name = document.getElementById('matched-user-name').innerText;
      document.getElementById('chat-title').innerText = `${name} とのチャット`;
      switchView('view-chat');
    }

    function openGroupChat(threadName) {
      document.getElementById('chat-title').innerText = threadName;
      switchView('view-chat');
    }

    /* 背景玉ボケ・粒子 Canvas アニメーション */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 40 + 10;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.15 + 0.05;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) this.reset();
      }
      draw() {
        ctx.beginPath();
        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        g.addColorStop(0, `rgba(59, 130, 246, ${this.alpha})`);
        g.addColorStop(1, 'rgba(10, 13, 20, 0)');
        ctx.fillStyle = g;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
