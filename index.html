<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HIMA-LAB - Realtime Community</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --panel-bg: rgba(15, 21, 32, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --header-bg: rgba(6, 8, 13, 0.8);
      --input-bg: rgba(255, 255, 255, 0.05);
    }

    body.theme-light {
      --bg-base: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(0, 0, 0, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --header-bg: rgba(255, 255, 255, 0.85);
      --input-bg: rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-base); color: var(--text-primary); height: 100vh; height: 100dvh; overflow: hidden; position: relative; transition: background-color 0.3s, color 0.3s; }

    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .app-container { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: flex; flex-direction: column; backdrop-filter: blur(8px); }

    header { height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--panel-border); background: var(--header-bg); flex-shrink: 0; z-index: 10; }
    .brand-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .brand-sub { font-size: 10px; color: var(--text-muted); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .online-counter { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); background: var(--input-bg); border: 1px solid var(--panel-border); padding: 4px 10px; border-radius: 20px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--success-color); box-shadow: 0 0 8px var(--success-color); }

    .view-section { display: none !important; width: 100%; height: calc(100vh - 56px); height: calc(100dvh - 56px); overflow: hidden; }
    
    body.mode-pc #view-dashboard.active { display: grid !important; grid-template-columns: 1fr 340px; grid-template-rows: 1fr; gap: 16px; padding: 16px 24px; }
    body.mode-pc #view-chat.active { display: grid !important; grid-template-columns: 1fr 280px; width: 100%; height: calc(100vh - 56px); }
    
    body.mode-mobile #view-dashboard.active { display: flex !important; flex-direction: column; gap: 12px; padding: 12px; overflow-y: auto; }
    body.mode-mobile #view-dashboard .viewport-panel { min-height: 140px; padding: 16px 12px; }
    body.mode-mobile #view-dashboard .sidebar-panel { min-height: 300px; }
    
    body.mode-mobile #view-chat.active { display: flex !important; flex-direction: column; width: 100%; height: calc(100vh - 56px); height: calc(100dvh - 56px); position: relative; }
    body.mode-mobile #view-chat .sidebar-panel { display: none; }
    body.mode-mobile .chat-main { height: 100%; display: flex; flex-direction: column; position: relative; }
    body.mode-mobile .chat-messages { flex: 1; padding-bottom: 90px; }
    body.mode-mobile .chat-input-area { position: absolute; bottom: 0; left: 0; right: 0; background: var(--header-bg); border-top: 1px solid var(--panel-border); padding: 10px 12px; z-index: 20; }

    .viewport-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
    .sidebar-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--panel-border); font-size: 13px; font-weight: 600; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-content { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    .user-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--input-bg); border: 1px solid var(--panel-border); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .user-item:hover { background: rgba(255,255,255,0.08); }
    .user-item.selected { border-color: var(--accent-color); background: rgba(37, 99, 235, 0.15); }

    .avatar-icon-img { border-radius: 50%; object-fit: cover; background: #334155; display: flex; align-items: center; justify-content: center; }

    .chat-main { display: flex; flex-direction: column; border-right: 1px solid var(--panel-border); height: 100%; overflow: hidden; position: relative; flex: 1; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--panel-border); font-weight: 700; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .message-item { display: flex; flex-direction: column; max-width: 75%; gap: 4px; }
    .message-item.self { align-self: flex-end; align-items: flex-end; }
    .message-item.system { align-self: center; align-items: center; max-width: 100%; margin: 6px 0; }
    .message-bubble { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 10px 14px; border-radius: 12px; font-size: 13px; word-break: break-all; }
    .message-item.self .message-bubble { background: var(--accent-color); color: #fff; border: none; }
    .message-item.system .message-bubble { background: var(--input-bg); border: none; color: var(--text-secondary); font-size: 11px; padding: 4px 12px; border-radius: 20px; }

    .chat-media-preview { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 4px; object-fit: cover; }

    .chat-input-area { padding: 12px 16px; border-top: 1px solid var(--panel-border); display: flex; gap: 8px; align-items: center; background: var(--header-bg); }
    .chat-input { flex: 1; background: var(--input-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; color: var(--text-primary); outline: none; font-size: 15px; }

    .btn-action-primary { background: var(--accent-color); color: #ffffff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-action-primary:hover { background: var(--accent-hover); }
    .btn-action-primary:disabled { background: #334155; cursor: not-allowed; opacity: 0.6; }
    .btn-action-secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text-primary); padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-action-secondary:hover { background: var(--input-bg); }
    .btn-action-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger-color); color: #fca5a5; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px); padding: 16px; }
    .modal-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; width: 440px; max-width: 100%; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

    .avatar-selector { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .avatar-option { font-size: 22px; padding: 6px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; background: var(--input-bg); }
    .avatar-option.selected { border-color: var(--accent-color); background: rgba(37, 99, 235, 0.3); }
  </style>
</head>
<body class="mode-pc theme-dark">

  <div id="canvas-container"></div>

  <!-- 1. プロフィール設定モーダル -->
  <div id="modal-profile" class="modal-backdrop">
    <div class="modal-card">
      <div style="font-size:16px; font-weight:700; text-align:center;">プロフィール作成</div>
      
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:12px; color:var(--text-secondary); font-weight:600;">アイコン選択（プリセット / 画像）</label>
        <div class="avatar-selector">
          <span class="avatar-option selected" onclick="selectPresetAvatar('🐱', this)">🐱</span>
          <span class="avatar-option" onclick="selectPresetAvatar('🐶', this)">🐶</span>
          <span class="avatar-option" onclick="selectPresetAvatar('🦊', this)">🦊</span>
          <span class="avatar-option" onclick="selectPresetAvatar('🐼', this)">🐼</span>
          <span class="avatar-option" onclick="selectPresetAvatar('🐯', this)">🐯</span>
        </div>
        <div style="text-align:center; margin-top:4px;">
          <label for="custom-avatar-input" class="btn-action-secondary" style="padding:6px 14px; font-size:11px; cursor:pointer; display:inline-block;">📁 画像を選択</label>
          <input type="file" id="custom-avatar-input" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
        </div>
        <div id="avatar-preview-container" style="display:none; text-align:center; margin-top:4px;">
          <img id="avatar-preview-img" style="width:36px; height:36px; border-radius:50%; object-fit:cover; vertical-align:middle; border:2px solid var(--accent-color);">
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:var(--text-secondary); font-weight:600;">ユーザーネーム（必須）</label>
        <input type="text" id="init-username" style="background:var(--input-bg); border:1px solid var(--panel-border); border-radius:8px; padding:10px; color:var(--text-primary);" placeholder="例: ゲスト" maxlength="15">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:var(--text-secondary); font-weight:600;">自己紹介文・一言（任意）</label>
        <textarea id="init-bio" style="background:var(--input-bg); border:1px solid var(--panel-border); border-radius:8px; padding:10px; color:var(--text-primary); height:60px; resize:none;" placeholder="自由に書いてください（書かなくても大丈夫です）" maxlength="60"></textarea>
      </div>

      <button class="btn-action-primary" style="margin-top:10px;" onclick="saveInitialProfile()">プロフィールを決定して開始</button>
    </div>
  </div>

  <!-- 2. チャット申請送信中の待機表示 -->
  <div id="modal-requesting" class="modal-backdrop" style="display:none;">
    <div class="modal-card" style="text-align:center; gap:16px;">
      <div style="font-size:15px; font-weight:700;">チャットリクエスト送信中</div>
      <p style="font-size:12px; color:var(--text-secondary);"><span id="request-target-name">相手</span> の応答を待っています...</p>
      <div style="width:40px; height:40px; border-radius:50%; border:3px solid var(--panel-border); border-top-color:var(--accent-color); animation:spin 1s linear infinite; margin:10px auto;"></div>
      <button class="btn-action-secondary" onclick="cancelChatRequest()">リクエストを取り消す</button>
    </div>
  </div>

  <!-- 3. チャット申請受信モーダル（相手側） -->
  <div id="modal-incoming-request" class="modal-backdrop" style="display:none;">
    <div class="modal-card" style="text-align:center; gap:16px;">
      <div style="font-size:15px; font-weight:700;">チャットのリクエストが届きました</div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div id="incoming-req-avatar"></div>
        <div style="font-weight:700; font-size:14px;" id="incoming-req-name">相手名</div>
        <div style="font-size:12px; color:var(--text-secondary);" id="incoming-req-bio"></div>
      </div>
      <div style="display:flex; gap:12px; margin-top:8px;">
        <button class="btn-action-secondary" style="flex:1;" onclick="respondChatRequest(false)">キャンセル（拒否）</button>
        <button class="btn-action-primary" style="flex:1;" onclick="respondChatRequest(true)">チャットを始める</button>
      </div>
    </div>
  </div>

  <!-- メインレイアウト -->
  <div class="app-container">
    <header>
      <div>
        <span class="brand-title">HIMA-LAB</span>
        <span class="brand-sub">Realtime Community</span>
      </div>
      <div class="header-actions">
        <button class="btn-action-secondary" style="padding:4px 10px; font-size:11px;" id="theme-toggle-btn" onclick="toggleTheme()">🌙 ダーク</button>
        <button class="btn-action-secondary" style="padding:4px 10px; font-size:11px;" id="mode-toggle-btn" onclick="toggleDisplayMode()">📱 スマホ表示</button>
        <div class="online-counter"><div class="status-dot"></div><span id="online-count">0 online</span></div>
        <div id="user-profile-badge" style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600;"></div>
      </div>
    </header>

    <!-- ダッシュボード -->
    <div id="view-dashboard" class="view-section active">
      <section class="viewport-panel">
        <h2 style="font-size:18px;">オンラインユーザーを選択してチャット開始</h2>
        <p style="font-size:12px; color:var(--text-secondary); max-width:400px; line-height:1.6;">
          右側（スマホは下記）の「オンラインユーザー一覧」から話したい相手をタップし、「選択した相手とチャットを開始」ボタンを押してください。
        </p>
        <div id="selected-user-box" style="margin-top:10px; font-size:13px; font-weight:600; color:var(--accent-color);">
          相手が選択されていません
        </div>
        <button class="btn-action-primary" id="btn-start-chat-request" onclick="sendChatRequest()" disabled>選択した相手とチャットを開始</button>
      </section>

      <aside class="sidebar-panel">
        <div class="sidebar-header">
          <span>オンラインユーザー一覧</span>
        </div>
        <div class="sidebar-content" id="sidebar-users"></div>
      </aside>
    </div>

    <!-- チャット画面 -->
    <div id="view-chat" class="view-section">
      <div class="chat-main">
        <div class="chat-header">
          <span id="chat-title" style="font-size:14px;">チャットルーム</span>
          <button class="btn-action-secondary" style="padding:4px 10px; font-size:11px;" onclick="leaveChat()">退室する</button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
          <div class="message-item system"><div class="message-bubble">チャットを開始しました。</div></div>
        </div>

        <div class="chat-input-area">
          <label for="media-upload-input" class="btn-action-secondary" style="padding:8px 12px; font-size:14px; cursor:pointer;" title="画像・動画を送信">📷/🎥</label>
          <input type="file" id="media-upload-input" accept="image/*,video/*" style="display:none;" onchange="handleMediaUpload(event)">
          <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button class="btn-action-primary" style="padding:10px 14px;" onclick="sendMessage()">送信</button>
        </div>
      </div>
      
      <aside class="sidebar-panel">
        <div class="sidebar-header">会話中の相手</div>
        <div class="sidebar-content" id="chat-partner-info"></div>
      </aside>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yssmhumtrdihpketcuux.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzc21odW10cmRpaHBrZXRjdXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDAwNjUsImV4cCI6MjEwMzc3NjA2NX0.HOcbBjjw4dnuY4mLRjBmNEYMeIMSodXyvmYeWa0gzzA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* 端末固有IDの取得・生成 (同一端末自演防止用) */
    let myDeviceId = localStorage.getItem('hima_device_id');
    if (!myDeviceId) {
      myDeviceId = 'device_' + Math.random().toString(36).substring(2, 15) + Date.now();
      localStorage.setItem('hima_device_id', myDeviceId);
    }

    const myUserId = 'user_' + Math.floor(Math.random() * 100000);
    let myUserName = '';
    let myAvatar = '🐱';
    let myBio = '';

    let onlineUsers = [];
    let selectedTargetUser = null;
    let currentPartner = null;
    let pendingIncomingReq = null;

    /* ブロック管理リスト（ローカルストレージに保持） */
    let blockedUsers = JSON.parse(localStorage.getItem('hima_blocked_users') || '[]');

    /* ブロック処理：相手に通知はいかず静かにブロック */
    function blockUser(targetUserId, targetUserName) {
      if (!confirm(`${targetUserName} をブロックしますか？\n（相手に通知が届くことはありません）`)) return;
      if (!blockedUsers.includes(targetUserId)) {
        blockedUsers.push(targetUserId);
        localStorage.setItem('hima_blocked_users', JSON.stringify(blockedUsers));
      }
      alert(`${targetUserName} をブロックしました。`);
      if (currentPartner && currentPartner.id === targetUserId) {
        leaveChat();
      } else {
        selectedTargetUser = null;
        updateSelectedUserUI();
        renderSidebarUsers();
      }
    }

    /* テーマ切替 */
    let currentTheme = 'dark';
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.className = `mode-${currentMode} theme-${currentTheme}`;
      document.getElementById('theme-toggle-btn').innerText = currentTheme === 'dark' ? '🌙 ダーク' : '☀️ ライト';
      if (planeMat) {
        planeMat.color.setHex(currentTheme === 'dark' ? 0x3b82f6 : 0x0284c7);
        planeMat.opacity = currentTheme === 'dark' ? 0.15 : 0.25;
      }
    }

    /* 表示モード切替 */
    let currentMode = 'pc';
    function autoDetectDevice() { setDisplayMode(window.innerWidth <= 768 ? 'mobile' : 'pc'); }
    function toggleDisplayMode() { setDisplayMode(currentMode === 'pc' ? 'mobile' : 'pc'); }
    function setDisplayMode(mode) {
      currentMode = mode;
      document.body.className = `mode-${mode} theme-${currentTheme}`;
      document.getElementById('mode-toggle-btn').innerText = mode === 'mobile' ? '💻 PC表示' : '📱 スマホ表示';
    }
    window.addEventListener('load', autoDetectDevice);

    /* プロフィール設定 */
    function selectPresetAvatar(avatar, el) {
      myAvatar = avatar;
      document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('avatar-preview-container').style.display = 'none';
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        myAvatar = evt.target.result;
        document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
        document.getElementById('avatar-preview-img').src = myAvatar;
        document.getElementById('avatar-preview-container').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function renderAvatarHTML(avatarData, size = '32px') {
      if (avatarData && avatarData.startsWith('data:image')) {
        return `<img src="${avatarData}" class="avatar-icon-img" style="width:${size}; height:${size};">`;
      }
      return `<div class="avatar-icon-img" style="width:${size}; height:${size}; font-size:calc(${size} * 0.5);">${avatarData || '🐱'}</div>`;
    }

    function saveInitialProfile() {
      const name = document.getElementById('init-username').value.trim();
      if (!name) { alert('ユーザーネームを入力してください'); return; }

      myUserName = name;
      myBio = document.getElementById('init-bio').value.trim();

      document.getElementById('user-profile-badge').innerHTML = `${renderAvatarHTML(myAvatar, '24px')} <span>${myUserName}</span>`;
      document.getElementById('modal-profile').style.display = 'none';

      initRealtime();
    }

    /* Supabase リアルタイム通信 */
    let room;
    function initRealtime() {
      room = supabaseClient.channel('global-room', { config: { broadcast: { self: true } } });

      room.on('presence', { event: 'sync' }, () => {
        const state = room.presenceState();
        onlineUsers = [];
        for (let id in state) { state[id].forEach(u => onlineUsers.push(u)); }
        document.getElementById('online-count').innerText = `${onlineUsers.length} online`;
        renderSidebarUsers();
      });

      /* チャットリクエスト受信（相手側） */
      room.on('broadcast', { event: 'chat_request_send' }, (payload) => {
        const data = payload.payload;
        // ブロックしている相手からのリクエストは無効化（通知も出さない）
        if (data.targetId === myUserId && !blockedUsers.includes(data.fromId)) {
          pendingIncomingReq = data;
          document.getElementById('incoming-req-avatar').innerHTML = renderAvatarHTML(data.fromAvatar, '60px');
          document.getElementById('incoming-req-name').innerText = data.fromName;
          document.getElementById('incoming-req-bio').innerText = data.fromBio || '（自己紹介未設定）';
          document.getElementById('modal-incoming-request').style.display = 'flex';
        }
      });

      /* チャットリクエスト応答結果受信（申請側） */
      room.on('broadcast', { event: 'chat_request_response' }, (payload) => {
        const data = payload.payload;
        if (data.targetId === myUserId) {
          document.getElementById('modal-requesting').style.display = 'none';
          if (data.accepted) {
            alert(`${data.responderName} がチャットを開始しました！`);
            currentPartner = { id: data.responderId, name: data.responderName, avatar: data.responderAvatar, bio: data.responderBio };
            openDirectChat();
          } else {
            alert(`${data.responderName} がリクエストをキャンセル（拒否）しました。`);
          }
        }
      });

      /* チャットメッセージ受信 */
      room.on('broadcast', { event: 'chat_message' }, (payload) => {
        const data = payload.payload;
        if (blockedUsers.includes(data.senderId)) return; // ブロック済ユーザーのメッセージ遮断
        if (currentPartner && (data.senderId === myUserId || data.senderId === currentPartner.id)) {
          appendMessage(data);
        }
      });

      room.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          room.track({ user_id: myUserId, device_id: myDeviceId, username: myUserName, avatar: myAvatar, bio: myBio });
        }
      });
    }

    /* オンラインユーザー一覧レンダリング */
    function renderSidebarUsers() {
      const sidebar = document.getElementById('sidebar-users');
      if (!sidebar) return;

      sidebar.innerHTML = onlineUsers.map(u => {
        const isSelf = u.user_id === myUserId;
        const isSameDevice = u.device_id === myDeviceId && !isSelf;
        const isBlocked = blockedUsers.includes(u.user_id);
        const isSelected = selectedTargetUser && selectedTargetUser.user_id === u.user_id;
        
        return `
          <div class="user-item ${isSelected ? 'selected' : ''}" onclick="selectUserFromList('${u.user_id}')">
            <div style="display:flex; align-items:center; gap:10px;">
              ${renderAvatarHTML(u.avatar, '32px')}
              <div>
                <div style="font-size:13px; font-weight:600;">
                  ${u.username} ${isSelf ? '(あなた)' : isSameDevice ? '(同一端末)' : ''}
                </div>
                <div style="font-size:10px; color:var(--text-muted);">${u.bio || '自己紹介なし'}</div>
              </div>
            </div>
            ${!isSelf && !isBlocked ? `<button class="btn-action-danger" onclick="event.stopPropagation(); blockUser('${u.user_id}', '${u.username}')">遮断</button>` : ''}
            ${isBlocked ? `<span style="font-size:10px; color:var(--danger-color);">ブロック済</span>` : ''}
          </div>
        `;
      }).join('');
    }

    function selectUserFromList(userId) {
      const target = onlineUsers.find(u => u.user_id === userId);
      if (!target) return;
      if (target.user_id === myUserId) { alert('自分自身を選択することはできません。'); return; }
      if (target.device_id === myDeviceId) { alert('同一端末（自演防止）のユーザーには申請できません。'); return; }
      if (blockedUsers.includes(target.user_id)) { alert('ブロック中のユーザーです。'); return; }

      selectedTargetUser = target;
      updateSelectedUserUI();
      renderSidebarUsers();
    }

    function updateSelectedUserUI() {
      const infoBox = document.getElementById('selected-user-box');
      const btn = document.getElementById('btn-start-chat-request');
      if (selectedTargetUser) {
        infoBox.innerText = `選択中: ${selectedTargetUser.username}`;
        btn.disabled = false;
      } else {
        infoBox.innerText = '相手が選択されていません';
        btn.disabled = true;
      }
    }

    /* リクエスト送信 */
    function sendChatRequest() {
      if (!selectedTargetUser) return;
      document.getElementById('request-target-name').innerText = selectedTargetUser.username;
      document.getElementById('modal-requesting').style.display = 'flex';

      room.send({
        type: 'broadcast',
        event: 'chat_request_send',
        payload: {
          targetId: selectedTargetUser.user_id,
          fromId: myUserId,
          fromName: myUserName,
          fromAvatar: myAvatar,
          fromBio: myBio
        }
      });
    }

    function cancelChatRequest() {
      document.getElementById('modal-requesting').style.display = 'none';
    }

    /* リクエストに応答（相手側） */
    function respondChatRequest(accepted) {
      document.getElementById('modal-incoming-request').style.display = 'none';
      if (!pendingIncomingReq) return;

      room.send({
        type: 'broadcast',
        event: 'chat_request_response',
        payload: {
          targetId: pendingIncomingReq.fromId,
          responderId: myUserId,
          responderName: myUserName,
          responderAvatar: myAvatar,
          responderBio: myBio,
          accepted: accepted
        }
      });

      if (accepted) {
        currentPartner = {
          id: pendingIncomingReq.fromId,
          name: pendingIncomingReq.fromName,
          avatar: pendingIncomingReq.fromAvatar,
          bio: pendingIncomingReq.fromBio
        };
        openDirectChat();
      }
      pendingIncomingReq = null;
    }

    /* チャット画面操作 */
    function openDirectChat() {
      document.getElementById('chat-title').innerText = `${currentPartner.name} とのチャット`;
      document.getElementById('chat-partner-info').innerHTML = `
        <div style="text-align:center; padding:16px 0; display:flex; flex-direction:column; align-items:center; gap:8px;">
          ${renderAvatarHTML(currentPartner.avatar, '60px')}
          <div style="font-weight:700; font-size:15px;">${currentPartner.name}</div>
          <div style="font-size:12px; color:var(--text-secondary); max-width:200px;">${currentPartner.bio || '自己紹介なし'}</div>
          <button class="btn-action-danger" style="margin-top:14px;" onclick="blockUser('${currentPartner.id}', '${currentPartner.name}')">🚫 相手をブロック</button>
        </div>
      `;
      switchView('view-chat');
    }

    function leaveChat() {
      currentPartner = null;
      switchView('view-dashboard');
    }

    /* メッセージ・メディア送信機能 */
    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      room.send({
        type: 'broadcast',
        event: 'chat_message',
        payload: { sender: myUserName, senderId: myUserId, text: text, type: 'text' }
      });
      input.value = '';
    }

    function handleMediaUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith('video/');
      const reader = new FileReader();
      reader.onload = function(evt) {
        room.send({
          type: 'broadcast',
          event: 'chat_message',
          payload: {
            sender: myUserName,
            senderId: myUserId,
            mediaUrl: evt.target.result,
            type: isVideo ? 'video' : 'image'
          }
        });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function appendMessage(data) {
      const container = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      const isSelf = data.senderId === myUserId;
      
      msgDiv.className = `message-item ${isSelf ? 'self' : ''}`;

      let content = '';
      if (data.type === 'image') {
        content = `<img src="${data.mediaUrl}" class="chat-media-preview">`;
      } else if (data.type === 'video') {
        content = `<video src="${data.mediaUrl}" class="chat-media-preview" controls></video>`;
      } else {
        content = data.text;
      }

      msgDiv.innerHTML = `<div class="message-bubble">${content}</div>`;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function switchView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    /* Three.js 3D背景アニメーション */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, -15, 35);
    camera.lookAt(0, 5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const planeGeo = new THREE.PlaneGeometry(120, 80, 50, 40);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true, transparent: true, opacity: 0.15 });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 3;
    scene.add(plane);

    let count = 0;
    function animate() {
      requestAnimationFrame(animate);
      count += 0.02;
      const posArr = planeGeo.attributes.position.array;
      for (let i = 0; i < posArr.length; i += 3) {
        posArr[i + 2] = Math.sin(posArr[i] * 0.2 + count) * 1.5;
      }
      planeGeo.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
