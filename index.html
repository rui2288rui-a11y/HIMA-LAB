<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HIMA-LAB - リアルタイムマッチング</title>
  <!-- Supabase JS library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- モダンなフォント -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121620; /* 背景 */
      --bg-card: #1d2230; /* カード・サイドバー */
      --border-color: rgba(255, 255, 255, 0.06);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #3b82f6; /* ブルー */
      --accent-grad: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      --green: #10b981;
    }

    * { box-sizing: border-box; font-family: 'Zen Maru Gothic', sans-serif; transition: background 0.2s, color 0.2s; }
    body { margin: 0; background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    
    .app { width: 100%; max-width: 1440px; height: 100vh; display: flex; flex-direction: column; background: var(--bg-card); position: relative; overflow: hidden; }

    /* --------------------------------------------------
       ヘッダー
    -------------------------------------------------- */
    header { padding: 16px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .header-left .logo { font-weight: 900; font-size: 20px; color: var(--text-main); }
    
    .header-right { display: flex; align-items: center; gap: 16px; }
    /* 【要件】右上にオンライン人数を表示 */
    .online-count-badge { font-size: 12px; color: var(--green); font-weight: 700; background: rgba(16, 185, 129, 0.1); padding: 6px 14px; border-radius: 20px; }

    /* --------------------------------------------------
       メインコンテンツ (2列レイアウト)
    -------------------------------------------------- */
    .content { flex: 1; display: grid; grid-template-columns: 1fr 300px; overflow: hidden; }
    
    /* 左側：操作エリア */
    .main-area { padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
    .btn-main { padding: 16px 32px; background: var(--accent-grad); border: none; border-radius: 14px; color: white; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }

    /* 右側サイドバー：マッチ待機リスト */
    .sidebar { background: var(--bg-card); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; padding: 20px; }
    .sidebar-title { font-size: 14px; font-weight: 700; margin-bottom: 20px; text-align: center; color: var(--text-sub); }
    
    .waiting-list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* 性別ごとのセクション */
    .gender-section { display: flex; flex-direction: column; gap: 8px; }
    .gender-label { font-size: 12px; font-weight: 700; color: var(--text-sub); padding-bottom: 4px; border-bottom: 1px solid var(--border-color); }
    .female-label { color: #f472b6; }
    .male-label { color: #38bdf8; }

    .user-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255, 255, 255, 0.02); border-radius: 10px; }
    .user-name { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }

    /* 誰もいないときの表示 */
    .empty-state { font-size: 12px; color: var(--text-sub); text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <!-- 1. ヘッダー (オンライン人数表示) -->
    <header>
      <div class="header-left">
        <div class="logo">HIMA-LAB</div>
      </div>
      <div class="header-right">
        <!-- 【要件】現在オンラインの人数を出して -->
        <div class="online-count-badge" id="onlineCountBadge">🟢 0 online</div>
      </div>
    </header>

    <div class="content">
      <!-- 2. 左側：メイン操作エリア -->
      <main class="main-area">
        <h2>誰かと話してみる？</h2>
        <p style="font-size: 14px; color: var(--text-sub); margin-top: -10px;">「探す」ボタンを押して、マッチングを待ちましょう。</p>
        <!-- このボタンで待機状態をオンオフします -->
        <button class="btn-main" id="matchToggleBtn" onclick="toggleMatching()">🤝 1対1を探す</button>
      </main>

      <!-- 3. 右側：サイドバー (待機リスト・性別分け) -->
      <aside class="sidebar">
        <div class="sidebar-title">マッチング待機中</div>
        
        <div class="waiting-list-container" id="waitingListContainer">
          <!-- ここにリアルタイムでユーザーが描写されます -->
        </div>
      </aside>
    </div>
  </div>

  <script>
    // Supabaseの設定
    const SUPABASE_URL = "https://yssmhumtrdihpketcuux.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzc21odW10cmRpaHBrZXRjdXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDAwNjUsImV4cCI6MjEwMzc3NjA2NX0.HOcbBjjw4dnuY4mLRjBmNEYMeIMSodXyvmYeWa0gzzA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // このタブの固有ID、名前、性別（仮）
    const myId = 'usr_' + Math.random().toString(36).substring(2, 9);
    const myGender = localStorage.getItem('hima_gender') || '未設定'; // ここで性別を取得（実際はプロフィール設定画面で作る）
    const myName = `ユーザー_${myId.substr(-4)}`;
    
    let isWaiting = false; // 現在マッチング待機中かどうか
    let lobbyChannel = null; // Supabaseのチャンネル

    // システム初期化
    async function initSystem() {
      // 1. SupabaseのRealtimeチャンネルに接続
      lobbyChannel = supabaseClient.channel('match_lobby', {
        config: { presence: { key: myId } }
      });

      // 2. 誰かが接続・切断、または状態を変えた瞬間のイベント
      lobbyChannel.on('presence', { event: 'sync' }, () => {
        const state = lobbyChannel.presenceState();
        const allUsers = Object.values(state).flat();

        // 【要件】オンライン人数を表示
        document.getElementById('onlineCountBadge').innerText = `🟢 ${allUsers.length} online`;

        // 【要件】マッチ待ちの人を右側に表示（自分以外、かつ待機中の人）
        const waitingUsers = allUsers.filter(u => u.isWaiting && u.id !== myId);
        renderWaitingList(waitingUsers);
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          // 初期状態（待機していない）をトラック開始
          await lobbyChannel.track({ id: myId, name: myName, gender: myGender, isWaiting: false });
        }
      });
    }

    // 「1対1を探す」ボタンの処理
    async function toggleMatching() {
      isWaiting = !isWaiting;
      const btn = document.getElementById('matchToggleBtn');

      if (isWaiting) {
        btn.innerText = "✖ 待機をキャンセル";
        btn.style.background = "#ef4444"; // 赤色に
      } else {
        btn.innerText = "🤝 1対1を探す";
        btn.style.background = ""; // 元の色に
      }

      // Supabaseに自分の待機状態を更新して通知
      await lobbyChannel.track({ id: myId, name: myName, gender: myGender, isWaiting: isWaiting });
    }

    // 【要件】男性、女性、未設定に右側で分けて描写
    function renderWaitingList(users) {
      const container = document.getElementById('waitingListContainer');
      container.innerHTML = ''; // 一旦クリア

      if (users.length === 0) {
        // 誰もいないときは何も表示しない（メッセージのみ）
        container.innerHTML = `<div class="empty-state">待機中のユーザーはいません</div>`;
        return;
      }

      // 性別ごとにグループ化
      const grouped = {
        '女性': users.filter(u => u.gender === '女性'),
        '男性': users.filter(u => u.gender === '男性'),
        '未設定': users.filter(u => u.gender !== '男性' && u.gender !== '女性')
      };

      // 各セクションを描写
      ['女性', '男性', '未設定'].forEach(gender => {
        const list = grouped[gender];
        if (list.length > 0) {
          // セクションのHTMLを作成
          let sectionHtml = `
            <div class="gender-section">
              <div class="gender-label ${gender === '女性' ? 'female-label' : (gender === '男性' ? 'male-label' : '')}">${gender}</div>
          `;
          
          // ユーザーを追加
          list.forEach(u => {
            sectionHtml += `
              <div class="user-item">
                <span class="user-name">${u.name}</span>
                <div class="status-dot"></div>
              </div>
            `;
          });

          sectionHtml += `</div>`; // セクションを閉じる
          container.innerHTML += sectionHtml;
        }
      });
    }

    // サイト読み込み時に実行
    window.onload = initSystem;
  </script>
</body>
</html>
