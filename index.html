<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HIMA LAB - ひまラボ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --btn-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --msg-me: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --msg-other: #334155;
    }

    [data-theme="light"] {
      --bg-main: #f0f4f9;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --btn-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --msg-me: linear-gradient(135deg, #4f46e5 0%, #6d28d9 100%);
      --msg-other: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: 'Zen Maru Gothic', sans-serif; transition: background 0.2s, color 0.2s; }
    body { margin: 0; background: #020617; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    /* PC表示時はスマホ風フレーム、スマホ表示時は全画面 */
    .app { width: 100%; max-width: 450px; height: 100vh; display: flex; flex-direction: column; background: var(--bg-card); position: relative; overflow: hidden; }
    @media (min-width: 600px) {
      .app { height: 92vh; border-radius: 32px; border: 2px solid var(--border-color); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    }

    header { padding: 14px 18px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .logo { font-weight: 900; font-size: 20px; background: linear-gradient(135deg, #ff007a, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn-sm { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: bold; }

    .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; gap: 16px; overflow-y: auto; }
    .card { width: 100%; background: var(--bg-main); padding: 20px; border-radius: 24px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; }
    
    .input-field { display: flex; flex-direction: column; gap: 4px; text-align: left; }
    .input-field label { font-size: 12px; color: var(--text-sub); font-weight: bold; }
    .input-field input, .input-field select { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 14px; font-size: 14px; outline: none; }

    .btn-main { width: 100%; padding: 14px; border-radius: 16px; border: none; font-size: 16px; font-weight: 900; color: white; background: var(--btn-grad); cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
    .btn-main:active { transform: scale(0.98); }

    /* モーダル（規約・通報） */
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--bg-card); border-radius: 20px; padding: 20px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-color); width: 100%; font-size: 13px; line-height: 1.6; }

    /* チャット UI */
    .chat-screen { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .chat-bar { padding: 10px 16px; background: var(--bg-main); font-size: 12px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    
    .msg-group { display: flex; gap: 8px; max-width: 85%; }
    .msg-group.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--border-color); }
    .msg-bubble { background: var(--msg-other); color: var(--text-main); padding: 10px 14px; border-radius: 16px 16px 16px 4px; font-size: 14px; word-break: break-all; }
    .msg-group.me .msg-bubble { background: var(--msg-me); color: white; border-radius: 16px 16px 4px 16px; }
    .msg-img { max-width: 100%; border-radius: 10px; margin-top: 4px; display: block; }
    .report-link { font-size: 10px; color: #ef4444; border: none; background: none; cursor: pointer; padding: 0; margin-top: 2px; }

    .input-box { padding: 10px 14px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
    .input-box input[type="text"] { flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 16px; border-radius: 20px; font-size: 14px; outline: none; }
  </style>
</head>
<body data-theme="dark">
  <div class="app">
    <!-- 利用規約モーダル -->
    <div class="modal" id="termsModal">
      <div class="modal-content">
        <h3>利用規約・ガイドライン</h3>
        <p>1. 誹謗中傷、公序良俗に反するコンテンツの送信を禁止します。</p>
        <p>2. 不適切な言動や通報が一定数に達した場合、AI判定により即座にアカウントが永久停止されます。</p>
        <p>3. 違反テキストや画像は自動検知システムにより削除されます。</p>
        <button class="btn-main" onclick="closeTerms()" style="margin-top:10px;">同意して閉じる</button>
      </div>
    </div>

    <!-- ヘッダー -->
    <header>
      <div class="logo">⚡ HIMA LAB</div>
      <div class="header-right">
        <button class="btn-sm" onclick="toggleTheme()">🌙/☀️</button>
        <button class="btn-sm" onclick="showTerms()">規約</button>
      </div>
    </header>

    <!-- メイン選択画面 -->
    <div class="screen" id="homeScreen">
      <div class="card">
        <div class="input-field">
          <label>ニックネーム</label>
          <input type="text" id="usernameInput" value="ひま人">
        </div>
        <div class="input-field">
          <label>性別</label>
          <select id="genderSelect">
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="秘密" selected>秘密</option>
          </select>
        </div>
        <button class="btn-main" onclick="startMatching(1)">🤝 1対1マッチング（個室）</button>
        <button class="btn-main" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="joinGroupRoom()">🔊 最大20人通話グループ部屋</button>
      </div>
    </div>

    <!-- 待機画面 -->
    <div class="screen" id="matchingScreen" style="display:none;">
      <h3>🔍 相手を探しています...</h3>
      <p style="font-size:12px; color:var(--text-sub);">1対1の専用部屋を生成中</p>
      <button class="btn-sm" onclick="cancelMatching()">キャンセル</button>
    </div>

    <!-- チャット画面 -->
    <div class="chat-screen" id="chatScreen">
      <div class="chat-bar">
        <span id="roomStatus">🟢 接続中</span>
        <button class="btn-sm" style="color:#ef4444;" onclick="leaveChat()">退出</button>
      </div>
      <div class="chat-area" id="chatBox"></div>
      <div class="input-box">
        <label style="cursor:pointer; font-size:18px;">📁<input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" onchange="uploadMedia(event)"></label>
        <input type="text" id="msgInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="btn-sm" style="background:var(--btn-grad); color:white;" onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yssmhumtrdihpketcuux.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzc21odW10cmRpaHBrZXRjdXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDAwNjUsImV4cCI6MjEwMzc3NjA2NX0.HOcbBjjw4dnuY4mLRjBmNEYMeIMSodXyvmYeWa0gzzA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myId = 'usr_' + Math.random().toString(36).substring(2, 9);
    let myName = "ひま人_" + Math.floor(1000 + Math.random() * 9000);
    document.getElementById('usernameInput').value = myName;

    let currentRoomId = null;
    let matchChannel = null;
    let isBanned = localStorage.getItem('hima_banned') === 'true';

    function toggleTheme() {
      const b = document.body;
      b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    function showTerms() { document.getElementById('termsModal').style.display = 'flex'; }
    function closeTerms() { document.getElementById('termsModal').style.display = 'none'; }

    // 1対1のマッチング（3人同時参加の徹底防止）
    async function startMatching(limit) {
      if (isBanned) return alert("規約違反により、この端末からのアクセスは自動制限されています。");

      myName = document.getElementById('usernameInput').value.trim() || myName;
      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('matchingScreen').style.display = 'flex';

      matchChannel = supabaseClient.channel('queue_lobby', { config: { presence: { key: myId } } });
      
      matchChannel.on('presence', { event: 'sync' }, () => {
        const state = matchChannel.presenceState();
        const users = Object.keys(state).sort();

        // 正確に2名だけを抽出し、他を完全に遮断
        if (users.length >= 2) {
          const pair = users.slice(0, 2);
          if (pair.includes(myId)) {
            currentRoomId = `pair_${pair[0]}_${pair[1]}`;
            enterChat(`1対1 個室チャット`);
          }
        }
      }).subscribe(async (status) => {
        if (status === 'SUBSCRIBED') await matchChannel.track({ id: myId, name: myName });
      });
    }

    // 最大20人グループ部屋
    async function joinGroupRoom() {
      if (isBanned) return alert("アクセス制限中");
      currentRoomId = `group_room_max20`;
      enterChat(`20人グループ部屋`);
    }

    function cancelMatching() {
      if (matchChannel) matchChannel.unsubscribe();
      document.getElementById('homeScreen').style.display = 'flex';
      document.getElementById('matchingScreen').style.display = 'none';
    }

    function enterChat(title) {
      if (matchChannel) matchChannel.unsubscribe();
      document.getElementById('matchingScreen').style.display = 'none';
      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
      document.getElementById('roomStatus').innerText = `🟢 ${title}`;
      document.getElementById('chatBox').innerHTML = '';
      initChatRoom();
    }

    function leaveChat() {
      document.getElementById('chatScreen').style.display = 'none';
      document.getElementById('homeScreen').style.display = 'flex';
      currentRoomId = null;
    }

    async function initChatRoom() {
      // メッセージのロード
      const { data } = await supabaseClient.from('messages').select('*').eq('room_id', currentRoomId).order('id', { ascending: true });
      if (data) data.forEach(renderMsg);

      // リアルタイム購読
      supabaseClient.channel(`room_${currentRoomId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${currentRoomId}` }, payload => {
          renderMsg(payload.new);
        }).subscribe();
    }

    function renderMsg(msg) {
      const box = document.getElementById('chatBox');
      const isMe = msg.username === myName;
      
      const div = document.createElement('div');
      div.className = `msg-group ${isMe ? 'me' : ''}`;
      
      let body = `<div class="msg-bubble">`;
      if (msg.content) body += `<div>${msg.content}</div>`;
      if (msg.image_url) {
        const isVid = msg.image_url.match(/\.(mp4|webm|mov)$/i);
        body += isVid ? `<video src="${msg.image_url}" controls class="msg-img"></video>` : `<img src="${msg.image_url}" class="msg-img"/>`;
      }
      if (!isMe) {
        body += `<button class="report-link" onclick="reportUser('${msg.username}', '${msg.content || 'メディア'}')">⚠️ 通報する</button>`;
      }
      body += `</div>`;

      div.innerHTML = `<img src="https://api.dicebear.com/7.x/bottts/svg?seed=${msg.username}" class="msg-avatar">${body}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // メッセージ送信 ＆ AI自動検知モック
    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !currentRoomId) return;
      
      // 簡易AIテキスト検知（NGワードの検知）
      const ngWords = ["死ね", "殺す", "暴言"];
      if (ngWords.some(w => text.includes(w))) {
        alert("【AI判定】不適切な発言が検知されたため、アカウントを制限しました。");
        localStorage.setItem('hima_banned', 'true');
        location.reload();
        return;
      }

      input.value = '';
      await supabaseClient.from('messages').insert([{ content: text, username: myName, room_id: currentRoomId }]);
    }

    // メディア送信
    async function uploadMedia(e) {
      const file = e.target.files[0];
      if (!file || !currentRoomId) return;

      const fileName = `${Date.now()}_${Math.random().toString(36).substr(2,4)}.${file.name.split('.').pop()}`;
      const { data, error } = await supabaseClient.storage.from('chat-media').upload(fileName, file);
      
      if (error) {
        alert("送信失敗: SupabaseのStorage設定（Policy）を確認してください。");
        return;
      }

      const { data: pub } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      await supabaseClient.from('messages').insert([{ image_url: pub.publicUrl, username: myName, room_id: currentRoomId }]);
    }

    // 通報機能 ＆ 自動削除判定
    async function reportUser(targetUser, content) {
      if (confirm(`${targetUser} さんを不適切な発言・コンテンツで通報しますか？`)) {
        let count = parseInt(localStorage.getItem(`reports_${targetUser}`) || '0') + 1;
        localStorage.setItem(`reports_${targetUser}`, count);

        if (count >= 2) {
          alert("【AI自動処理】対象ユーザーに対する複数の通報を確認したため、該当ユーザーのアカウントを一時停止しました。");
        } else {
          alert("通報を受理しました。運営AIがログを監視します。");
        }
      }
    }
  </script>
</body>
</html>
