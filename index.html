
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>HIMA LAB</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; position: relative; }
    
    header { padding: 14px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: bold; font-size: 18px; color: #38bdf8; letter-spacing: 1px; }
    .online-count { font-size: 12px; color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 4px 8px; border-radius: 12px; border: 1px solid rgba(74, 222, 128, 0.2); }

    /* トップ画面メニュー */
    .home-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; gap: 16px; text-align: center; }
    .home-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .home-desc { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
    .menu-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }

    /* チャット画面 */
    .chat-screen { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .msg-wrapper { display: flex; align-items: flex-end; gap: 6px; align-self: flex-start; max-width: 85%; }
    .msg { background: #334155; padding: 10px 14px; border-radius: 16px 16px 16px 2px; word-break: break-all; }
    .msg-media { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
    .delete-btn { font-size: 11px; color: #ef4444; background: none; border: none; cursor: pointer; padding: 2px 4px; opacity: 0.7; }
    .delete-btn:hover { opacity: 1; text-decoration: underline; }

    .input-bar { padding: 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    .file-btn { background: #334155; color: #94a3b8; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
    input[type="file"] { display: none; }
    input[type="text"] { flex: 1; background: #334155; border: none; color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 15px; outline: none; }
    .send-btn { background: #0284c7; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    .back-btn { background: none; border: none; color: #94a3b8; font-size: 14px; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">⚡ HIMA LAB</div>
      <div class="online-count" id="onlineCount">🟢 オンライン: 1人</div>
    </header>

    <div class="home-screen" id="homeScreen">
      <div class="home-title">暇つぶしチャットへようこそ</div>
      <div class="home-desc">誰でも匿名で気軽に会話できるスペースです</div>
      
      <button class="menu-btn btn-primary" onclick="enterChat('global')">💬 チャットを始める</button>
      <button class="menu-btn btn-secondary" onclick="enterChat('random')">🔍 不特定多数の人を探す (ランダム)</button>
    </div>

    <div class="chat-screen" id="chatScreen">
      <div style="padding: 8px 16px; background: #1b263b; font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between;">
        <span id="roomName">グローバルルーム</span>
        <button class="back-btn" onclick="showHome()">✕ 退室する</button>
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="input-bar">
        <label class="file-btn">📁<input type="file" id="mediaInput" accept="image/*,video/*" onchange="uploadMedia(event)"></label>
        <input type="text" id="msgInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yssmhumtrdihpketcuux.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzc21odW10cmRpaHBrZXRjdXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDAwNjUsImV4cCI6MjEwMzc3NjA2NX0.HOcbBjjw4dnuY4mLRjBmNEYMeIMSodXyvmYeWa0gzzA";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // オンライン人数のカウント（Presence）
    const roomChannel = supabaseClient.channel('online-users');
    roomChannel
      .on('presence', { event: 'sync' }, () => {
        const state = roomChannel.presenceState();
        const count = Object.keys(state).length;
        document.getElementById('onlineCount').innerText = `🟢 オンライン: ${count}人`;
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await roomChannel.track({ online_at: new Date().toISOString() });
        }
      });

    let currentRoom = 'global';

    function enterChat(roomType) {
      currentRoom = roomType;
      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
      document.getElementById('roomName').innerText = roomType === 'global' ? 'みんなの広場' : 'ランダムマッチング';
      
      document.getElementById('chatBox').innerHTML = '';
      initChat();
    }

    function showHome() {
      document.getElementById('homeScreen').style.display = 'flex';
      document.getElementById('chatScreen').style.display = 'none';
    }

    async function initChat() {
      const { data } = await supabaseClient.from('messages').select('*').order('id', { ascending: true });
      if (data) data.forEach(addMessageToScreen);

      supabaseClient.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          addMessageToScreen(payload.new);
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
          removeMessageFromScreen(payload.old.id);
        })
        .subscribe();
    }

    function addMessageToScreen(msg) {
      const box = document.getElementById('chatBox');
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      wrapper.id = `msg-${msg.id}`;

      let html = `<div class="msg">`;
      if (msg.content) html += `<div>${msg.content}</div>`;
      if (msg.image_url) {
        const isVideo = msg.image_url.match(/\.(mp4|webm|mov)$/i);
        if (isVideo) {
          html += `<video src="${msg.image_url}" controls class="msg-media"></video>`;
        } else {
          html += `<img src="${msg.image_url}" class="msg-media" />`;
        }
      }
      html += `</div>`;
      html += `<button class="delete-btn" onclick="deleteMessage(${msg.id})">削除</button>`;

      wrapper.innerHTML = html;
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
    }

    function removeMessageFromScreen(id) {
      const el = document.getElementById(`msg-${id}`);
      if (el) el.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await supabaseClient.from('messages').insert([{ content: text }]);
    }

    async function uploadMedia(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;

      const { data, error } = await supabaseClient.storage.from('chat-media').upload(fileName, file);
      if (error) {
        alert('送信失敗: ' + error.message);
        return;
      }
      const { data: publicUrlData } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      await supabaseClient.from('messages').insert([{ image_url: publicUrlData.publicUrl }]);
    }

    async function deleteMessage(id) {
      if (!confirm('このメッセージを取り消しますか？')) return;
      const { error } = await supabaseClient.from('messages').delete().eq('id', id);
      if (error) alert('削除できませんでした: ' + error.message);
    }
  </script>
</body>
</html>
