<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>HIMA LAB</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; }
    header { padding: 16px; background: #0f172a; border-bottom: 1px solid #334155; text-align: center; font-weight: bold; font-size: 18px; color: #38bdf8; letter-spacing: 1px; }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { display: flex; flex-direction: column; max-width: 80%; background: #334155; padding: 10px 14px; border-radius: 16px 16px 16px 2px; align-self: flex-start; word-break: break-all; }
    .msg-media { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
    .input-bar { padding: 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    .file-btn { background: #334155; color: #94a3b8; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: 0.2s; }
    .file-btn:hover { background: #475569; color: #fff; }
    input[type="file"] { display: none; }
    input[type="text"] { flex: 1; background: #334155; border: none; color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 15px; outline: none; }
    input[type="text"]::placeholder { color: #94a3b8; }
    button { background: #0284c7; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="app">
    <header>⚡ HIMA LAB</header>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-bar">
      <label class="file-btn">📁<input type="file" id="mediaInput" accept="image/*,video/*" onchange="uploadMedia(event)"></label>
      <input type="text" id="msgInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yssmhumtrdihpketcuux.supabase.co";
    const SUPABASE_KEY = "ここにAPIキーを貼り付け";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function initChat() {
      const { data } = await supabaseClient.from('messages').select('*').order('id', { ascending: true });
      if (data) data.forEach(addMessageToScreen);

      supabaseClient.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          addMessageToScreen(payload.new);
        })
        .subscribe();
    }

    function addMessageToScreen(msg) {
      const box = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';
      let html = '';
      if (msg.content) html += `<div>${msg.content}</div>`;
      if (msg.image_url) {
        const isVideo = msg.image_url.match(/\.(mp4|webm|mov)$/i);
        if (isVideo) {
          html += `<video src="${msg.image_url}" controls class="msg-media"></video>`;
        } else {
          html += `<img src="${msg.image_url}" class="msg-media" />`;
        }
      }
      msgDiv.innerHTML = html;
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await supabaseClient.from('messages').insert([{ content: text }]);
    }

  async function uploadMedia(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fileName = `${Date.now()}_${file.name}`;
      const { data, error } = await supabaseClient.storage.from('chat-media').upload(fileName, file);
      if (error) {
        alert('送信失敗: ' + error.message);
        return;
      }
      const { data: publicUrlData } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      await supabaseClient.from('messages').insert([{ image_url: publicUrlData.publicUrl }]);
    }
  </script>
</body>
</html>
