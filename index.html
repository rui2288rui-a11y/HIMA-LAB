<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>HIMA LAB</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --border-color: #2a364f;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --accent: #38bdf8;
      --msg-me: #0284c7;
      --msg-other: #1e293b;
    }

    [data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --primary: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --accent: #2563eb;
      --msg-me: #2563eb;
      --msg-other: #e2e8f0;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s, color 0.3s; }
    body { margin: 0; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: var(--bg-card); border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); position: relative; overflow: hidden; }
    
    header { padding: 14px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .logo { font-weight: 900; font-size: 20px; background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1.5px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .theme-toggle { background: var(--border-color); border: none; color: var(--text-main); padding: 6px 10px; border-radius: 20px; cursor: pointer; font-size: 14px; }
    .online-count { font-size: 12px; color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2); font-weight: bold; }

    /* 各画面共通 */
    .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; gap: 20px; overflow-y: auto; text-align: center; }
    .profile-box { width: 100%; background: var(--bg-main); padding: 24px; border-radius: 20px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    
    .input-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .input-group label { font-size: 12px; color: var(--text-sub); font-weight: bold; }
    .input-group input[type="text"], .input-group select { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
    .avatar-preview { width: 80px; height: 80px; border-radius: 50%; background: var(--border-color); object-fit: cover; margin: 0 auto; border: 3px solid var(--accent); }
    
    .btn-main { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; color: white; background: var(--primary); cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); transition: transform 0.1s, opacity 0.2s; }
    .btn-main:active { transform: scale(0.98); }

    /* レーダーアニメーション（待機画面） */
    .radar-box { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .radar-circle { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: pulse 2s infinite ease-out; }
    .radar-circle:nth-child(2) { animation-delay: 0.6s; }
    .radar-circle:nth-child(3) { animation-delay: 1.2s; }
    .radar-icon { font-size: 40px; z-index: 2; }
    @keyframes pulse { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

    /* マッチング成功時の閃光演出 */
    .match-flash { position: absolute; inset: 0; background: var(--primary); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-size: 28px; font-weight: 900; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    .match-flash.active { opacity: 1; pointer-events: auto; }

    /* チャット画面 */
    .chat-screen { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .chat-header { padding: 10px 16px; background: var(--bg-main); font-size: 13px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    
    .msg-row { display: flex; gap: 10px; align-items: flex-start; max-width: 85%; }
    .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--border-color); }
    .msg-content-wrap { display: flex; flex-direction: column; gap: 4px; }
    .msg-row.me .msg-content-wrap { align-items: flex-end; }
    .msg-header { font-size: 11px; color: var(--text-sub); display: flex; gap: 6px; align-items: center; }
    .gender-badge { font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
    .gender-男性 { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .gender-女性 { background: rgba(244, 114, 182, 0.2); color: #f472b6; }
    
    .msg { background: var(--msg-other); color: var(--text-main); padding: 12px 16px; border-radius: 18px 18px 18px 4px; word-break: break-all; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .msg-row.me .msg { background: var(--msg-me); color: white; border-radius: 18px 18px 4px 18px; }
    .msg-media { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
    .delete-btn { font-size: 10px; color: #ef4444; background: none; border: none; cursor: pointer; padding: 2px 0; opacity: 0.6; }

    .input-bar { padding: 12px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
    .file-btn { background: var(--bg-main); color: var(--text-sub); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; border: 1px solid var(--border-color); }
    input[type="file"] { display: none; }
    .input-bar input[type="text"] { flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 18px; border-radius: 24px; font-size: 15px; outline: none; }
    .send-btn { background: var(--primary); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  </style>
</head>
<body data-theme="dark">
  <div class="app">
    <!-- マッチングフラッシュ演出 -->
    <div class="match-flash" id="matchFlash">
      <div>MATCHED!</div>
      <div style="font-size:14px; font-weight:normal; margin-top:8px;">相手が見つかりました</div>
    </div>

    <header>
      <div class="logo">HIMA LAB</div>
      <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️</button>
        <div class="online-count" id="onlineCount">🟢 1人</div>
      </div>
    </header>

    <!-- プロフィール設定画面 -->
    <div class="screen" id="homeScreen">
      <div style="font-size:22px; font-weight:800; letter-spacing:0.5px;">プロフィール設定</div>
      <div class="profile-box">
        <img id="avatarPreview" class="avatar-preview" src="https://via.placeholder.com/80/2a364f/ffffff?text=Icon" alt="icon">
        <div class="input-group">
          <label>アイコン画像</label>
          <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
          <button class="btn-main" style="background:var(--border-color); font-size:13px; padding:10px; box-shadow:none;" onclick="document.getElementById('avatarInput').click()">画像を選択</button>
        </div>
        <div class="input-group">
          <label>ユーザーネーム</label>
          <input type="text" id="usernameInput" placeholder="例: 名無しさん" value="名無し">
        </div>
        <div class="input-group">
          <label>性別</label>
          <select id="genderSelect">
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="秘密" selected>秘密</option>
          </select>
        </div>
        <button class="btn-main" onclick="startMatching()">✨ 相手を探す</button>
      </div>
    </div>

    <!-- マッチング待機画面 -->
    <div class="screen" id="matchingScreen" style="display:none;">
      <div class="radar-box">
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div class="radar-icon">🔍</div>
      </div>
      <div style="font-size:20px; font-weight:bold;">相手を探しています...</div>
      <div style="font-size:13px; color:var(--text-sub);">全国の暇な人と自動でマッチング中</div>
      <button class="btn-main" style="background:var(--border-color); margin-top:20px; width:auto; padding:12px 28px; box-shadow:none;" onclick="cancelMatching()">キャンセル</button>
    </div>

    <!-- チャット画面 -->
    <div class="chat-screen" id="chatScreen">
      <div class="chat-header">
        <span>🟢 相手と接続中</span>
        <button style="background:none; border:none; color:var(--text-sub); font-size:13px; cursor:pointer;" onclick="leaveChat()">✕ 退出</button>
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="input-bar">
        <label class="file-btn">📁<input type="file" id="mediaInput" accept="image/*,video/*" onchange="uploadMedia(event)"></label>
        <input type="text" id="msgInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yssmhumtrdihpketcuux.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzc21odW10cmRpaHBrZXRjdXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDAwNjUsImV4cCI6MjEwMzc3NjA2NX0.HOcbBjjw4dnuY4mLRjBmNEYMeIMSodXyvmYeWa0gzzA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = { id: 'u_' + Math.random().toString(36).substring(2, 9), name: "名無し", gender: "秘密", avatar: "" };
    let currentRoomId = null;
    let matchChannel = null;

    // 白黒テーマ切り替え
    function toggleTheme() {
      const body = document.body;
      body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    // 全体オンライン数表示
    const presenceChannel = supabaseClient.channel('global-presence');
    presenceChannel.on('presence', { event: 'sync' }, () => {
      document.getElementById('onlineCount').innerText = `🟢 ${Object.keys(presenceChannel.presenceState()).length}人`;
    }).subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ online_at: Date.now() });
    });

    function previewAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        document.getElementById('avatarPreview').src = event.target.result;
        currentUser.avatar = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function startMatching() {
      const name = document.getElementById('usernameInput').value.trim();
      if (name) currentUser.name = name;
      currentUser.gender = document.getElementById('genderSelect').value;

      const avatarFile = document.getElementById('avatarInput').files[0];
      if (avatarFile) {
        const fileName = `avatar_${Date.now()}.${avatarFile.name.split('.').pop()}`;
        const { data } = await supabaseClient.storage.from('chat-media').upload(fileName, avatarFile);
        if (data) currentUser.avatar = supabaseClient.storage.from('chat-media').getPublicUrl(fileName).data.publicUrl;
      }

      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('matchingScreen').style.display = 'flex';

      // 安定したマッチング判定処理
      matchChannel = supabaseClient.channel('lobby_queue', { config: { presence: { key: currentUser.id } } });
      
      matchChannel.on('presence', { event: 'sync' }, () => {
        const state = matchChannel.presenceState();
        const userIds = Object.keys(state).sort();

        if (userIds.length >= 2) {
          const pair = userIds.slice(0, 2);
          if (pair.includes(currentUser.id)) {
            currentRoomId = `room_${pair[0]}_${pair[1]}`;
            triggerMatchSuccess();
          }
        }
      }).subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await matchChannel.track({ user: currentUser });
        }
      });
    }

    function cancelMatching() {
      if (matchChannel) matchChannel.unsubscribe();
      document.getElementById('homeScreen').style.display = 'flex';
      document.getElementById('matchingScreen').style.display = 'none';
    }

    function triggerMatchSuccess() {
      if (matchChannel) matchChannel.unsubscribe();
      
      const flash = document.getElementById('matchFlash');
      flash.classList.add('active');
      
      setTimeout(() => {
        flash.classList.remove('active');
        document.getElementById('matchingScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'flex';
        document.getElementById('chatBox').innerHTML = '';
        initChat();
      }, 1200);
    }

    function leaveChat() {
      document.getElementById('chatScreen').style.display = 'none';
      document.getElementById('homeScreen').style.display = 'flex';
      currentRoomId = null;
    }

    async function initChat() {
      const { data } = await supabaseClient.from('messages').select('*').eq('room_id', currentRoomId).order('id', { ascending: true });
      if (data) data.forEach(addMessageToScreen);

      supabaseClient.channel(`room_chat:${currentRoomId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${currentRoomId}` }, payload => {
          addMessageToScreen(payload.new);
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
          removeMessageFromScreen(payload.old.id);
        })
        .subscribe();
    }

    function addMessageToScreen(msg) {
      const box = document.getElementById('chatBox');
      const isMe = msg.username === currentUser.name;
      
      const row = document.createElement('div');
      row.className = `msg-row ${isMe ? 'me' : ''}`;
      row.id = `msg-${msg.id}`;

      const avatarSrc = msg.avatar_url || 'https://via.placeholder.com/38/2a364f/ffffff?text=U';
      
      let html = `<img src="${avatarSrc}" class="msg-avatar">`;
      html += `<div class="msg-content-wrap">`;
      html += `<div class="msg-header">`;
      html += `<span>${msg.username || '名無し'}</span>`;
      if (msg.gender) html += `<span class="gender-badge gender-${msg.gender}">${msg.gender}</span>`;
      html += `</div><div class="msg">`;
      if (msg.content) html += `<div>${msg.content}</div>`;
      if (msg.image_url) {
        const isVideo = msg.image_url.match(/\.(mp4|webm|mov)$/i);
        html += isVideo ? `<video src="${msg.image_url}" controls class="msg-media"></video>` : `<img src="${msg.image_url}" class="msg-media" />`;
      }
      html += `</div>`;
      if (isMe) {
        html += `<button class="delete-btn" onclick="deleteMessage(${msg.id})">送信取り消し</button>`;
      }
      html += `</div>`;

      row.innerHTML = html;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function removeMessageFromScreen(id) {
      const el = document.getElementById(`msg-${id}`);
      if (el) el.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !currentRoomId) return;
      input.value = '';
      await supabaseClient.from('messages').insert([{
        content: text,
        username: currentUser.name,
        gender: currentUser.gender,
        avatar_url: currentUser.avatar,
        room_id: currentRoomId
      }]);
    }

    async function uploadMedia(e) {
      const file = e.target.files[0];
      if (!file || !currentRoomId) return;

      const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
      const { data, error } = await supabaseClient.storage.from('chat-media').upload(fileName, file);
      if (error) return alert('送信失敗: ' + error.message);

      const { data: publicUrlData } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      await supabaseClient.from('messages').insert([{
        image_url: publicUrlData.publicUrl,
        username: currentUser.name,
        gender: currentUser.gender,
        avatar_url: currentUser.avatar,
        room_id: currentRoomId
      }]);
    }

    async function deleteMessage(id) {
      if (!confirm('メッセージを取り消しますか？')) return;
      await supabaseClient.from('messages').delete().eq('id', id);
    }
  </script>
</body>
</html>
