<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIMA-LAB - Realtime Community</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Three.js (3D背景演出用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --panel-bg: rgba(15, 21, 32, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.4);
      --online-indicator: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; }
    body { background-color: var(--bg-base); color: var(--text-primary); height: 100vh; overflow: hidden; position: relative; }

    /* Three.js 3D背景 */
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .app-container { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; backdrop-filter: blur(8px); }

    /* ヘッダー */
    header { height: 64px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--panel-border); background: rgba(6, 8, 13, 0.6); }
    .brand-title { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; color: #ffffff; }
    .brand-sub { font-size: 11px; color: var(--text-muted); }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .online-counter { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border); padding: 6px 14px; border-radius: 20px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--online-indicator); box-shadow: 0 0 8px var(--online-indicator); }

    .btn-auth { background: transparent; border: 1px solid var(--panel-border); color: var(--text-primary); padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-auth:hover { background: rgba(255, 255, 255, 0.05); }
    .btn-auth.primary { background: var(--text-primary); color: var(--bg-base); border: none; font-weight: 600; }

    /* ビュー制御 */
    .view-section { display: none; width: 100%; height: calc(100vh - 64px); }
    .view-section.active { display: flex; }

    /* ダッシュボード */
    #view-dashboard { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr 200px; gap: 20px; padding: 20px 28px; }
    .viewport-panel { grid-column: 1 / 2; grid-row: 1 / 2; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .sidebar-panel { grid-column: 2 / 3; grid-row: 1 / 3; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--panel-border); font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .sidebar-content { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .threads-panel { grid-column: 1 / 2; grid-row: 2 / 3; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px 20px; }

    /* リアルタイムユーザーカード */
    .user-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--panel-border); border-radius: 8px; }
    .user-item-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-color); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
    .user-item-name { font-size: 13px; font-weight: 500; }

    /* マッチング中 */
    #view-matching { flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
    .progress-circle { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--panel-border); border-top-color: var(--accent-color); animation: spin 1.2s linear infinite; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* マッチ成立 */
    #view-matched { flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
    .match-cards { display: flex; gap: 32px; align-items: center; }
    .user-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 220px; }
    .avatar-placeholder { width: 80px; height: 80px; border-radius: 50%; background: var(--panel-border); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }

    /* チャット */
    #view-chat { display: grid; grid-template-columns: 1fr 280px; width: 100%; height: calc(100vh - 64px); }
    .chat-main { display: flex; flex-direction: column; border-right: 1px solid var(--panel-border); }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--panel-border); font-weight: 700; }
    .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message-item { display: flex; flex-direction: column; max-width: 70%; gap: 4px; }
    .message-item.self { align-self: flex-end; align-items: flex-end; }
    .message-sender { font-size: 11px; color: var(--text-muted); }
    .message-bubble { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 12px 16px; border-radius: 12px; font-size: 14px; word-break: break-all; }
    .message-item.self .message-bubble { background: var(--accent-color); border: none; }
    
    .chat-input-area { padding: 16px 24px; border-top: 1px solid var(--panel-border); display: flex; gap: 12px; }
    .chat-input { flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; color: var(--text-primary); outline: none; }

    /* ボタン類 */
    .btn-action-primary { background: var(--accent-color); color: #ffffff; border: none; padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 20px var(--accent-glow); transition: all 0.2s; }
    .btn-action-primary:hover { background: var(--accent-hover); }
    .btn-action-secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text-primary); padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-action-secondary:hover { background: rgba(255, 255, 255, 0.05); }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="app-container">
    <header>
      <div class="brand">
        <span class="brand-title">HIMA-LAB</span>
        <span class="brand-sub">Realtime Community Platform</span>
      </div>
      <div class="header-actions">
        <div class="online-counter">
          <div class="status-dot"></div>
          <span id="online-count">0 online</span>
        </div>
        <button class="btn-auth">ログイン</button>
        <button class="btn-auth primary">新規登録</button>
      </div>
    </header>

    <!-- 1. ダッシュボード画面 -->
    <div id="view-dashboard" class="view-section active">
      <section class="viewport-panel">
        <h2 style="font-size:20px; font-weight:600;">1対1のセッションを開始</h2>
        <button class="btn-action-primary" onclick="switchView('view-matching')">待機キューに入る</button>
      </section>

      <aside class="sidebar-panel">
        <div class="sidebar-header">現在接続中のユーザー</div>
        <div class="sidebar-content" id="sidebar-users">
          <div style="font-size:12px; color:var(--text-muted); text-align:center; padding-top:20px;">接続ユーザーを確認中...</div>
        </div>
      </aside>

      <section class="threads-panel">
        <div style="font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:12px;">アクティブスレッド</div>
        <button class="btn-action-secondary" style="padding:10px 20px; font-size:13px;" onclick="openGroupChat('#映画ファン (120名)')">#映画ファン スレッドに参加</button>
      </section>
    </div>

    <!-- 2. マッチング中画面 -->
    <div id="view-matching" class="view-section">
      <h2 style="font-size:24px; font-weight:600;">マッチング中...</h2>
      <p style="color:var(--text-secondary); font-size:14px;">希望条件と相性の良い人を検索しています。</p>
      <div class="progress-circle">75%</div>
      <button class="btn-action-secondary" onclick="switchView('view-matched')" style="margin-top:20px;">（デモ：マッチ成功させる）</button>
    </div>

    <!-- 3. マッチ成立画面 -->
    <div id="view-matched" class="view-section">
      <h2 style="font-size:28px; font-weight:700;">マッチしました！</h2>
      <div class="match-cards">
        <div class="user-card">
          <div class="avatar-placeholder">YOU</div>
          <div style="font-weight:700;">あなた</div>
        </div>
        <div style="font-size:20px; font-weight:700; color:var(--accent-color);">VS</div>
        <div class="user-card">
          <div class="avatar-placeholder">USER</div>
          <div style="font-weight:700;" id="matched-user-name">Kenji S.</div>
        </div>
      </div>
      <button class="btn-action-primary" onclick="openDirectChat()">1対1チャットを始める</button>
    </div>

    <!-- 4. チャット画面 -->
    <div id="view-chat" class="view-section">
      <div class="chat-main">
        <div class="chat-header" id="chat-title">チャットルーム</div>
        <div class="chat-messages" id="chat-messages">
          <div class="message-item">
            <span class="message-sender">System</span>
            <div class="message-bubble">リアルタイムチャットへようこそ！メッセージを入力して送信してください。</div>
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button class="btn-action-primary" style="padding:0 24px;" onclick="sendMessage()">送信</button>
          <button class="btn-action-secondary" onclick="switchView('view-dashboard')" style="padding:0 16px;">退室</button>
        </div>
      </div>
      <aside class="sidebar-panel" style="border-radius:0; border-top:none; border-bottom:none; border-right:none;">
        <div class="sidebar-header">参加メンバー</div>
        <div class="sidebar-content">
          <div style="font-size:13px; font-weight:600; color:var(--text-secondary);">オンラインリアルタイム同期中</div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    /* Supabase 初期化 */
    const SUPABASE_URL = 'https://yssmhumtrdihpketcuux.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzc21odW10cmRpaHBrZXRjdXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDAwNjUsImV4cCI6MjEwMzc3NjA2NX0.HOcbBjjw4dnuY4mLRjBmNEYMeIMSodXyvmYeWa0gzzA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ランダムな匿名ユーザー生成
    const myUserId = 'user_' + Math.floor(Math.random() * 10000);
    const myUserName = 'Guest_' + myUserId.slice(-4);

    /* リアルタイム Presence & Chat チャンネルの設定 */
    const room = supabaseClient.channel('global-room', {
      config: { broadcast: { self: true } }
    });

    // 1. オンライン状態の同期
    room.on('presence', { event: 'sync' }, () => {
      const state = room.presenceState();
      let userList = [];
      for (let id in state) {
        state[id].forEach(u => userList.push(u));
      }

      document.getElementById('online-count').innerText = `${userList.length} online`;

      const sidebar = document.getElementById('sidebar-users');
      if (userList.length === 0) {
        sidebar.innerHTML = `<div style="font-size:12px; color:var(--text-muted); text-align:center; padding-top:20px;">接続ユーザーはいません</div>`;
      } else {
        sidebar.innerHTML = userList.map(u => `
          <div class="user-item">
            <div class="user-item-avatar">${u.username.slice(0,2).toUpperCase()}</div>
            <div class="user-item-name">${u.username} ${u.user_id === myUserId ? '(あなた)' : ''}</div>
          </div>
        `).join('');
      }
    });

    // 2. メッセージ受信イベントの購読
    room.on('broadcast', { event: 'chat_message' }, (payload) => {
      const msgData = payload.payload;
      appendMessage(msgData.sender, msgData.text, msgData.senderId === myUserId);
    });

    room.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await room.track({
          user_id: myUserId,
          username: myUserName,
          online_at: new Date().toISOString()
        });
      }
    });

    /* メッセージ送信処理 */
    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      room.send({
        type: 'broadcast',
        event: 'chat_message',
        payload: {
          sender: myUserName,
          senderId: myUserId,
          text: text
        }
      });

      input.value = '';
    }

    /* メッセージ画面追加描画 */
    function appendMessage(sender, text, isSelf) {
      const container = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message-item ${isSelf ? 'self' : ''}`;
      msgDiv.innerHTML = `
        <span class="message-sender">${sender}</span>
        <div class="message-bubble">${escapeHtml(text)}</div>
      `;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* 画面切り替え制御 */
    function switchView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function openDirectChat() {
      const name = document.getElementById('matched-user-name').innerText;
      document.getElementById('chat-title').innerText = `${name} とのチャット`;
      switchView('view-chat');
    }

    function openGroupChat(threadName) {
      document.getElementById('chat-title').innerText = threadName;
      switchView('view-chat');
    }

    /* Three.js 3D背景アニメーション */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, -15, 35);
    camera.lookAt(0, 5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const planeGeo = new THREE.PlaneGeometry(120, 80, 50, 40);
    const planeMat = new THREE.MeshBasicMaterial({
      color: 0x3b82f6,
      wireframe: true,
      transparent: true,
      opacity: 0.15
    });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 3;
    scene.add(plane);

    const particleCount = 60;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    
    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 80;
      positions[i + 1] = (Math.random() - 0.5) * 60;
      positions[i + 2] = (Math.random() - 0.5) * 40;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0x60a5fa,
      size: 1.2,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    let count = 0;
    function animate() {
      requestAnimationFrame(animate);
      count += 0.02;

      const posArr = planeGeo.attributes.position.array;
      for (let i = 0; i < posArr.length; i += 3) {
        const x = posArr[i];
        const y = posArr[i + 1];
        posArr[i + 2] = Math.sin(x * 0.2 + count) * 1.5 + Math.cos(y * 0.2 + count) * 1.5;
      }
      planeGeo.attributes.position.needsUpdate = true;
      particles.rotation.y = count * 0.05;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
