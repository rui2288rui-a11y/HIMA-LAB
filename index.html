<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONNECT-X | リアルタイムコミュニティ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #151c2c;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #00f2fe;
      --accent-green: #10b981;
      --accent-grad: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      height: 64px; background: rgba(21, 28, 44, 0.8); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .logo { font-size: 20px; font-weight: 900; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .online-badge { font-size: 13px; color: var(--accent-green); background: rgba(16, 185, 129, 0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }

    .dashboard-container {
      flex: 1; display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 220px;
      gap: 16px; padding: 16px 24px; height: calc(100vh - 64px);
    }

    /* メインエリア */
    .main-area {
      grid-column: 1 / 2; grid-row: 1 / 2; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 24px;
      display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
    }
    .btn-main { padding: 14px 28px; background: var(--accent-grad); border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }

    /* サイドバー：マッチング待機リスト */
    .sidebar-area {
      grid-column: 2 / 3; grid-row: 1 / 3; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); }
    .category-tabs { display: flex; background: var(--bg-dark); padding: 4px; border-radius: 8px; gap: 4px; margin-top: 8px; }
    .tab-btn { flex: 1; padding: 6px 0; background: transparent; border: none; color: var(--text-sub); font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: #1e293b; color: var(--text-main); }
    
    .user-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .user-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.02); }

    /* 下部：スレッドエリア */
    .threads-area {
      grid-column: 1 / 2; grid-row: 2 / 3; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;
    }
    .threads-scroll-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .thread-card { min-width: 180px; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; flex-shrink: 0; }
    .btn-create-thread { min-width: 100px; background: rgba(255, 255, 255, 0.03); border: 2px dashed var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-sub); cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>

  <header>
    <div class="logo">CONNECT-X</div>
    <div class="online-badge" id="onlineCount">🟢 0人 オンライン</div>
  </header>

  <div class="dashboard-container">
    <!-- メイン操作部 -->
    <section class="main-area">
      <h2 id="myStatusText">1対1のマッチングを開始しますか？</h2>
      <button class="btn-main" id="matchToggleBtn" onclick="toggleMatching()">🤝 1対1を探す</button>
    </section>

    <!-- 待機中ユーザーリスト -->
    <aside class="sidebar-area">
      <div class="sidebar-header">
        <div style="font-weight: bold; font-size: 14px;">マッチ待機中のユーザー</div>
        <div class="category-tabs">
          <button class="tab-btn active" onclick="filterGender('all')">すべて</button>
          <button class="tab-btn" onclick="filterGender('女性')">女性</button>
          <button class="tab-btn" onclick="filterGender('男性')">男性</button>
        </div>
      </div>
      <div class="user-list" id="waitingUserList">
        <!-- リアルタイムで追加・削除される -->
      </div>
    </aside>

    <!-- グループスレッド -->
    <section class="threads-area">
      <div style="font-weight: bold; font-size: 14px;">アクティブなスレッド</div>
      <div class="threads-scroll-container" id="threadList">
        <button class="btn-create-thread" onclick="createNewThread()">＋ 新規スレッド</button>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://yssmhumtrdihpketcuux.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzc21odW10cmRpaHBrZXRjdXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDAwNjUsImV4cCI6MjEwMzc3NjA2NX0.HOcbBjjw4dnuY4mLRjBmNEYMeIMSodXyvmYeWa0gzzA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const myId = 'usr_' + Math.random().toString(36).substring(2, 7);
    const myGender = Math.random() > 0.5 ? '男性' : '女性';
    const myName = `ユーザー_${myId.substr(-4)}`;
    
    let isMatching = false;
    let globalChannel = null;
    let currentFilter = 'all';

    // 1. 全体接続とオンライン人数・待機リスト管理
    function initSystem() {
      globalChannel = supabaseClient.channel('global_lobby', { config: { presence: { key: myId } } });

      globalChannel.on('presence', { event: 'sync' }, () => {
        const state = globalChannel.presenceState();
        const allUsers = Object.values(state).flat();
        
        // 全体のオンライン人数を更新
        document.getElementById('onlineCount').innerText = `🟢 ${allUsers.length}人 オンライン`;

        // マッチング待機中のユーザーのみをリストアップ
        const waitingUsers = allUsers.filter(u => u.isWaiting && u.id !== myId);
        renderWaitingUsers(waitingUsers);

        // マッチングの自動判定（自分が待機中で、他に待機者がいる場合）
        if (isMatching && waitingUsers.length > 0) {
          const partner = waitingUsers[0];
          alert(`${partner.name} (${partner.gender}) さんとマッチしました！`);
          stopMatching();
        }
      }).subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await globalChannel.track({ id: myId, name: myName, gender: myGender, isWaiting: false });
        }
      });

      loadThreads();
      subscribeThreads();
    }

    // 2. マッチング待機トグル
    async function toggleMatching() {
      isMatching = !isMatching;
      const btn = document.getElementById('matchToggleBtn');
      const text = document.getElementById('myStatusText');

      if (isMatching) {
        btn.innerText = "✖ 待機をキャンセル";
        btn.style.background = "#ef4444";
        text.innerText = "相手を探しています...";
      } else {
        stopMatching();
      }

      await globalChannel.track({ id: myId, name: myName, gender: myGender, isWaiting: isMatching });
    }

    function stopMatching() {
      isMatching = false;
      const btn = document.getElementById('matchToggleBtn');
      const text = document.getElementById('myStatusText');
      btn.innerText = "🤝 1対1を探す";
      btn.style.background = "var(--accent-grad)";
      text.innerText = "1対1のマッチングを開始しますか？";
    }

    // 3. 待機中ユーザーリストの描写
    function renderWaitingUsers(users) {
      const listEl = document.getElementById('waitingUserList');
      listEl.innerHTML = '';

      const filtered = users.filter(u => currentFilter === 'all' || u.gender === currentFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="color:var(--text-sub); font-size:12px; text-align:center; padding:20px;">待機中のユーザーはいません</div>`;
        return;
      }

      filtered.forEach(u => {
        const item = document.createElement('div');
        item.className = 'user-item';
        item.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:13px;">${u.name}</div>
            <div style="font-size:10px; color:var(--text-sub);">${u.gender}</div>
          </div>
          <span style="font-size:10px; color:var(--accent-green);">待機中</span>
        `;
        listEl.appendChild(item);
      });
    }

    function filterGender(gender) {
      currentFilter = gender;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const state = globalChannel.presenceState();
      const waitingUsers = Object.values(state).flat().filter(u => u.isWaiting && u.id !== myId);
      renderWaitingUsers(waitingUsers);
    }

    // 4. スレッド機能（DB連携）
    async function loadThreads() {
      const { data } = await supabaseClient.from('threads').select('*').order('id', { ascending: false });
      if (data) {
        const container = document.getElementById('threadList');
        container.innerHTML = `<button class="btn-create-thread" onclick="createNewThread()">＋ 新規スレッド</button>`;
        data.forEach(renderThreadCard);
      }
    }

    function renderThreadCard(t) {
      const container = document.getElementById('threadList');
      const card = document.createElement('div');
      card.className = 'thread-card';
      card.innerHTML = `
        <div style="font-size:20px;">💬</div>
        <div style="font-weight:bold; font-size:13px; margin-top:4px;">${t.title}</div>
        <div style="font-size:10px; color:var(--accent-blue); margin-top:4px;">${t.tags ? t.tags.join(' ') : ''}</div>
      `;
      container.appendChild(card);
    }

    async function createNewThread() {
      const title = prompt("スレッドのタイトルを入力してください:");
      if (!title) return;
      const tagInput = prompt("タグをカンマ区切りで入力（例: アニメ,雑談）:");
      const tags = tagInput ? tagInput.split(',').map(t => `#${t.trim()}`) : [];

      await supabaseClient.from('threads').insert([{ title, tags }]);
    }

    function subscribeThreads() {
      supabaseClient.channel('public:threads')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'threads' }, payload => {
          loadThreads();
        }).subscribe();
    }

    window.onload = initSystem;
  </script>
</body>
</html>
